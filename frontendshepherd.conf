# frontendshepherd configuration. Every value shown is the built-in default,
# except dry_run, which ships as true so that installing changes nothing
# until you have looked at the log for a few days.
# Restart the service after editing: systemctl restart frontendshepherd
#
# A CPU is a logical CPU as counted by nproc and top: one hardware thread.
# With hyper-threading, 2 CPUs are one physical core.
# The numbers must fit the node: check them against nproc and free -g.

[general]
# Log what would happen, but limit nothing and send no mail.
dry_run = true
# Seconds between the daemon's checks. On each check it measures every
# user's CPU usage over the interval, updates their CPU budget and applies
# or lifts the throttle. Mails and log lines are also written then.
# The limits themselves (max_cpus, user_max_gb, the total memory limit)
# do not depend on this: the kernel enforces them at every moment.
interval = 10
# Users below this uid, and the users listed here, are never limited.
min_uid = 1000
exempt_users =
# Max processes+threads per user (stops fork bombs).
user_tasks_max = 8192
# Where the users' CPU budgets are saved between restarts.
state_dir = /var/lib/frontendshepherd
# Days to keep the history of events (throttles, kills, full disks, stale
# processes) for `frontendshepherd stats`. It is kept in history.jsonl in state_dir.
history_days = 365

[cpu]
# The number of CPUs a user can use without using their CPU budget. Usage at
# or below this is never throttled, and it is also the limit a throttled
# user is held to. It is a limit and not a guarantee: no CPUs are reserved
# per user, so on a busy node a user may get less.
min_cpus = 2
# Max CPUs one user can use at any moment, also for short bursts.
max_cpus = 8
# The CPU budget per user. Any usage above min_cpus is charged to the budget
# in full: 8 CPUs for 1 hour or 4 CPUs for 2 hours uses up a budget of
# 8 CPU-hours. When it is used up the user is throttled to min_cpus.
budget_cpu_hours = 8
# Hours for a used-up budget to be restored completely. The budget only
# recovers while the user's usage is below min_cpus, and a throttled user is
# released only when the whole budget is available again. A job that keeps running flat out
# at the throttled limit therefore stays throttled until it ends.
refill_hours = 4
# CPUs that all users together can never touch (kept for sshd and the
# system).
reserved_cpus = 2

[memory]
# Hard limit per user. When a user exceeds it the kernel kills all of that
# user's processes on the node. Other users are not affected.
user_max_gb = 16
# Memory that all users together can never touch. The total limit for
# users is RAM minus this; the node itself never runs out.
reserved_gb = 8

[mail]
enabled = true
# Mail server. Leave smtp_host empty to use the local sendmail instead.
smtp_host =
# 0 = the usual port for the chosen security (25, 587 or 465).
smtp_port = 0
# none, starttls or ssl
smtp_security = starttls
# Leave empty if the server needs no login. The password is read from a
# file, which should be readable by root only (chmod 600).
smtp_user =
smtp_password_file =
# Only used when smtp_host is empty.
sendmail = /usr/sbin/sendmail
# Sender. With an SMTP server this usually has to be a real address.
from = root
# Gets a mail when all users together hit the total memory limit of the
# node. Not copied on mails to users, unless repeat_events is set below.
admin = root
# Where a user's mail goes. {user} is the login name,
# for example {user}@example.org
address = {user}
# A mail is sent every time a user is throttled or killed for memory, but
# never more than this many to the same user within 24 hours.
max_mails_per_day = 100
# Copy the admin on a user's mail when that user has had this many events
# (throttles and processes killed for memory) within repeat_days.
# 0 = never copy the admin.
repeat_events = 0
repeat_days = 7
# Used in mail subjects. Default: the hostname.
cluster_name =
# The mail texts. Continuation lines must be indented; empty lines are kept.
# Placeholders: {user} {host} {cluster} {min_cpus} {max_cpus}
# {budget_cpu_hours} {refill_hours} {user_max_gb}, in throttle_body also
# {processes} (the user's busiest processes), in oom_body also {process}
# (the user's largest process), in ramdisk_note also {tmp_paths}, in repeat_note also
# {events} and {days}.
throttle_subject = [{cluster}] Your CPU usage on {host} has been limited
throttle_body =
    Hi {user},

    You have just used up your max allowed burst CPU usage of {budget_cpu_hours} CPU-hours
    on the login node {host}, so all your processes together are now limited
    to max {min_cpus} CPUs. Nothing has been killed.

    Login nodes are shared by everyone. Short burst workloads (e.g. compiling,
    installing software, building containers, developing code etc.) are allowed
    with up to max {max_cpus} CPUs at once, but not for extended periods of time.
    To prevent impacting the responsiveness of the login nodes, please submit
    long and heavy work as batch jobs, so that it runs on the dedicated compute
    nodes.

    The limit is lifted automatically once your processes have used less than
    {min_cpus} CPUs for a total of {refill_hours} hours. Run `frontendshepherd status` on the
    login node to check the status.

    Your busiest processes right now:

    {processes}
oom_subject = [{cluster}] Your processes on {host} were killed (too much memory usage)
oom_body =
    Hi {user},

    All your processes on the login node {host} were killed, and you were
    logged out, because together they used more memory than allowed (max
    {user_max_gb} GB per user, less if the login node is running out of memory).
    The largest process was `{process}`.

    Login nodes are shared by everyone. To prevent impacting the responsiveness
    of the login nodes, please submit long and memory-heavy work as batch jobs,
    so that it runs on the dedicated compute nodes.
# Added to the mail when the user's files in ramdisks were deleted, see [tmp].
ramdisk_note = Files in {tmp_paths} are kept in memory and count towards your memory limit, so your files there have been deleted.
# Added to a mail when the admin is copied on it.
repeat_note = This has happened {events} times within {days} days, so the cluster administrators have been copied on this message.

[tmp]
# Limit what each user can store in the temporary directories. Off by default.
#   off      no limit.
#   quota    a disk quota per user, set with `setquota` the first time the
#            user is seen. User quotas must already be enabled on the
#            filesystems that hold the paths (see the README), and the limit
#            is per filesystem, so it covers everything the user has on it.
#            A user at the limit gets "Disk quota exceeded", nothing is killed.
#   ramdisk  the paths become ramdisks (tmpfs) from the next boot. Files in
#            them use memory and count towards user_max_gb. A user who goes
#            over is killed like for any other memory, and their files in the
#            ramdisks are then deleted. Everything is lost at reboot. A
#            filesystem in /etc/fstab on one of the paths is no longer used.
mode = off
paths = /tmp /var/tmp
# mode = quota: the limit per user on each filesystem.
quota_gb = 50
# mode = ramdisk: the size of each ramdisk, for all users together.
# 0 = half of the node's memory.
ramdisk_gb = 0

[sheepdog]
# The sheepdog rounds up stale processes: it sends SIGTERM to processes
# older than max_age_days whose command line matches one of the (space
# separated) regular expressions. Meant for
# forgotten VS Code servers and their file watchers. VS Code restarts its
# server on the next connect, so an active user only sees a reconnect.
enabled = true
patterns = \.vscode-server/
max_age_days = 7
interval_minutes = 30
