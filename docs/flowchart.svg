<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 870" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
  <title>How frontendshepherd limits CPU and memory per user</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#ffffff}
      .line{fill:none;stroke:#475569;stroke-width:1.6;marker-end:url(#arrow)}
      .box{fill:#f1f5f9;stroke:#64748b;stroke-width:1.4}
      .ask{fill:#e0ecff;stroke:#3b6fd4;stroke-width:1.4}
      .ok{fill:#dcf5e3;stroke:#2e8b4f;stroke-width:1.4}
      .warn{fill:#ffedd0;stroke:#c8781a;stroke-width:1.4}
      .bad{fill:#fde0e0;stroke:#c23b3b;stroke-width:1.4}
      .note{fill:#ffffff;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5 4}
      text{fill:#1e293b}
      .b{font-weight:600}
      .lane{font-size:12px;font-weight:700;letter-spacing:1px;fill:#64748b;text-anchor:start}
      .yn{font-size:13px;font-weight:600;fill:#475569}
      .left{text-anchor:start}
      .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
    </style>
  </defs>

  <rect class="bg" width="1040" height="870" rx="12"/>

  <!-- start -->
  <rect class="box" x="230" y="20" width="610" height="50" rx="25"/>
  <text class="b" x="535" y="50">All processes of one user on the login node</text>
  <path class="line" d="M330 70V118"/>
  <path class="line" d="M740 70V118"/>
  <text class="lane" x="342" y="100">CPU · CHECKED EVERY 10 SECONDS</text>
  <text class="lane" x="752" y="100">MEMORY · ENFORCED BY THE KERNEL</text>

  <!-- CPU lane -->
  <path class="ask" d="M330 120L470 180L330 240L190 180z"/>
  <text x="330" y="176">CPU usage above</text>
  <text x="330" y="194"><tspan class="m">min_cpus</tspan>?</text>

  <path class="line" d="M190 180H172"/>
  <text class="yn" x="181" y="170">No</text>
  <rect class="ok" x="20" y="148" width="150" height="64" rx="8"/>
  <text class="b" x="95" y="176">Usage is free</text>
  <text x="95" y="195">Bucket refills.</text>

  <path class="line" d="M330 240V288"/>
  <text class="yn" x="352" y="268">Yes</text>
  <rect class="box" x="180" y="290" width="300" height="64" rx="8"/>
  <text class="b" x="330" y="317">Usage is taken from the user's bucket</text>
  <text x="330" y="337">Never more than <tspan class="m">burst_cpus</tspan> at once.</text>

  <path class="line" d="M330 354V398"/>
  <path class="ask" d="M330 400L440 450L330 500L220 450z"/>
  <text x="330" y="455">Bucket empty?</text>

  <path class="line" d="M440 450H540V180H472"/>
  <text class="yn" x="462" y="440">No</text>

  <path class="line" d="M330 500V548"/>
  <text class="yn" x="352" y="528">Yes</text>
  <rect class="warn" x="160" y="550" width="340" height="88" rx="8"/>
  <text class="b" x="330" y="577">User is throttled to <tspan class="m">min_cpus</tspan></text>
  <text x="330" y="598">The user gets an email.</text>
  <text x="330" y="618">No process is killed.</text>

  <path class="line" d="M330 638V678"/>
  <rect class="box" x="160" y="680" width="340" height="64" rx="8"/>
  <text x="330" y="707">Bucket refills only while usage is below</text>
  <text x="330" y="727"><tspan class="m">min_cpus</tspan>. Full after <tspan class="m">refill_hours</tspan>.</text>

  <path class="line" d="M330 744V788"/>
  <rect class="ok" x="160" y="790" width="340" height="50" rx="8"/>
  <text class="b" x="330" y="820">Bucket full: throttle is lifted</text>
  <path class="line" d="M160 815H95V214"/>

  <!-- memory lane: per user -->
  <path class="ask" d="M740 120L880 180L740 240L600 180z"/>
  <text x="740" y="176">User's memory above</text>
  <text x="740" y="194"><tspan class="m">user_max_gb</tspan>?</text>

  <path class="line" d="M740 240V288"/>
  <text class="yn" x="762" y="268">Yes</text>
  <rect class="bad" x="590" y="290" width="300" height="88" rx="8"/>
  <text class="b" x="740" y="317">That user's largest process is killed</text>
  <text x="740" y="338">No swapping. Other users are not affected.</text>
  <text x="740" y="358">The user gets an email.</text>

  <!-- memory lane: all users -->
  <path class="line" d="M880 180H985V395H740V408"/>
  <text class="yn" x="896" y="170">No</text>
  <path class="ask" d="M740 410L890 470L740 530L590 470z"/>
  <text x="740" y="466">All users together above</text>
  <text x="740" y="484">RAM minus <tspan class="m">reserved_gb</tspan>?</text>

  <path class="line" d="M890 470H913"/>
  <text class="yn" x="902" y="460">No</text>
  <rect class="ok" x="915" y="440" width="105" height="60" rx="8"/>
  <text class="b" x="967" y="475">No action</text>

  <path class="line" d="M740 530V578"/>
  <text class="yn" x="762" y="558">Yes</text>
  <rect class="bad" x="590" y="580" width="300" height="68" rx="8"/>
  <text class="b" x="740" y="608">Largest process of any user is killed</text>
  <text x="740" y="629">The admin gets an email.</text>

  <!-- notes -->
  <rect class="note" x="590" y="690" width="430" height="150" rx="8"/>
  <text class="b left" x="610" y="718">Not limited</text>
  <text class="left" x="610" y="743">• I/O and file transfers</text>
  <text class="left" x="610" y="766">• The number of users logged in</text>
  <text class="left" x="610" y="789">• root and system accounts</text>
  <text class="left" x="610" y="820">Each user's bucket holds <tspan class="m">bucket_cpu_hours</tspan>.</text>
</svg>
