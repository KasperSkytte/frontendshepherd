<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1020" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
  <title>How frontendshepherd limits CPU usage, memory usage and temporary files per user</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#ffffff}
      .line{fill:none;stroke:#475569;stroke-width:1.6;marker-end:url(#arrow)}
      .box{fill:#f1f5f9;stroke:#64748b;stroke-width:1.4}
      .ask{fill:#e0ecff;stroke:#3b6fd4;stroke-width:1.4}
      .ok{fill:#dcf5e3;stroke:#2e8b4f;stroke-width:1.4}
      .warn{fill:#ffedd0;stroke:#c8781a;stroke-width:1.4}
      .bad{fill:#fde0e0;stroke:#c23b3b;stroke-width:1.4}
      .note{fill:#ffffff;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5 4}
      text{fill:#1e293b}
      .b{font-weight:600}
      .lane{font-size:12px;font-weight:700;letter-spacing:1px;fill:#64748b;text-anchor:start}
      .yn{font-size:13px;font-weight:600;fill:#475569}
      .left{text-anchor:start}
      .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
    </style>
  </defs>

  <rect class="bg" width="1040" height="1020" rx="12"/>

  <!-- start -->
  <rect class="box" x="230" y="20" width="610" height="50" rx="25"/>
  <text class="b" x="535" y="50">All processes of one user on the login node</text>
  <path class="line" d="M330 70V118"/>
  <path class="line" d="M740 70V118"/>
  <text class="lane" x="342" y="92">CPU USAGE</text>
  <text class="lane" x="342" y="108">CHECKED EVERY 10 SECONDS</text>
  <text class="lane" x="752" y="92">MEMORY USAGE</text>
  <text class="lane" x="752" y="108">ENFORCED BY THE KERNEL</text>

  <!-- CPU lane -->
  <path class="ask" d="M330 120L470 180L330 240L190 180z"/>
  <text x="330" y="176">Is the user using more</text>
  <text x="330" y="194">than <tspan class="m">min_cpus</tspan> CPUs?</text>

  <path class="line" d="M190 180H172"/>
  <text class="yn" x="181" y="170">No</text>
  <rect class="ok" x="20" y="140" width="150" height="80" rx="8"/>
  <text class="b" x="95" y="166">No restrictions</text>
  <text x="95" y="187">The CPU budget</text>
  <text x="95" y="205">is not used.</text>

  <path class="line" d="M330 240V288"/>
  <text class="yn" x="352" y="268">Yes</text>
  <rect class="box" x="170" y="290" width="320" height="86" rx="8"/>
  <text class="b" x="330" y="316">The user's CPU budget is used</text>
  <text x="330" y="337">The budget is <tspan class="m">budget_cpu_hours</tspan>.</text>
  <text x="330" y="357">Never more than <tspan class="m">max_cpus</tspan> CPUs at once.</text>

  <path class="line" d="M330 376V418"/>
  <path class="ask" d="M330 420L450 470L330 520L210 470z"/>
  <text x="330" y="475">Is the budget used up?</text>

  <path class="line" d="M450 470H540V180H472"/>
  <text class="yn" x="470" y="460">No</text>

  <path class="line" d="M330 520V568"/>
  <text class="yn" x="352" y="548">Yes</text>
  <rect class="warn" x="160" y="570" width="340" height="88" rx="8"/>
  <text class="b" x="330" y="597">The user is throttled to <tspan class="m">min_cpus</tspan> CPUs</text>
  <text x="330" y="618">The user is notified by email.</text>
  <text x="330" y="638">No processes are killed.</text>

  <path class="line" d="M330 658V698"/>
  <rect class="box" x="160" y="700" width="340" height="86" rx="8"/>
  <text class="b" x="330" y="726">The budget recovers slowly</text>
  <text x="330" y="747">Only while the user stays below <tspan class="m">min_cpus</tspan>.</text>
  <text x="330" y="767">Full recovery takes <tspan class="m">refill_hours</tspan>.</text>

  <path class="line" d="M330 786V818"/>
  <rect class="ok" x="160" y="820" width="340" height="62" rx="8"/>
  <text class="b" x="330" y="846">The whole budget is available again</text>
  <text x="330" y="866">The throttle is lifted.</text>
  <path class="line" d="M160 851H95V222"/>

  <!-- memory lane: per user -->
  <path class="ask" d="M740 120L880 180L740 240L600 180z"/>
  <text x="740" y="176">Is the user using more</text>
  <text x="740" y="194">than <tspan class="m">user_max_gb</tspan>?</text>

  <path class="line" d="M740 240V288"/>
  <text class="yn" x="762" y="268">Yes</text>
  <rect class="bad" x="580" y="290" width="320" height="88" rx="8"/>
  <text class="b" x="740" y="317">All the user's processes are killed</text>
  <text x="740" y="338">Page swap disabled. Other users unaffected.</text>
  <text x="740" y="358">The user is notified by email.</text>

  <!-- memory lane: all users -->
  <path class="line" d="M880 180H985V395H740V408"/>
  <text class="yn" x="896" y="170">No</text>
  <path class="ask" d="M740 410L900 470L740 530L580 470z"/>
  <text x="740" y="466">Are all users together using more</text>
  <text x="740" y="484">than total RAM minus <tspan class="m">reserved_gb</tspan>?</text>

  <path class="line" d="M900 470H918"/>
  <text class="yn" x="909" y="460">No</text>
  <rect class="ok" x="920" y="440" width="105" height="60" rx="8"/>
  <text class="b" x="972" y="475">No action</text>

  <path class="line" d="M740 530V578"/>
  <text class="yn" x="762" y="558">Yes</text>
  <rect class="bad" x="590" y="580" width="300" height="84" rx="8"/>
  <text class="b" x="740" y="608">The user with the largest process</text>
  <text class="b" x="740" y="627">has all their processes killed</text>
  <text x="740" y="648">The admin is notified by email.</text>

  <!-- temporary files -->
  <text class="lane" x="590" y="704">TEMPORARY FILES IN /tmp AND /var/tmp</text>
  <text class="lane" x="590" y="720">OPTIONAL, OFF BY DEFAULT</text>
  <rect class="box" x="590" y="730" width="430" height="126" rx="8"/>
  <text class="b" x="805" y="756">Limited per user, depending on <tspan class="m">mode</tspan></text>
  <text class="left" x="610" y="782">• quota: at most <tspan class="m">quota_gb</tspan> on disk,</text>
  <text class="left" x="625" y="801">then writing fails. Nothing is killed.</text>
  <text class="left" x="610" y="826">• ramdisk: kept in memory, so the files</text>
  <text class="left" x="625" y="845">count towards <tspan class="m">user_max_gb</tspan>.</text>

  <!-- notes -->
  <rect class="note" x="590" y="880" width="430" height="120" rx="8"/>
  <text class="b left" x="610" y="908">Never limited</text>
  <text class="left" x="610" y="933">• I/O and file transfers</text>
  <text class="left" x="610" y="956">• The number of users logged in</text>
  <text class="left" x="610" y="979">• root and system accounts</text>
</svg>
